name: CI/CD Build & Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test-and-build:
    name: Backend CI & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations (Schema Verification)
        run: |
          alembic upgrade head

      - name: Test FastAPI Backend Startup
        env:
          SECRET_KEY: "test-secret-key-for-github-actions-build"
          DATABASE_URL: "sqlite:///./data/soulsense_test.db"
          APP_ENV: "testing"
        run: |
          python -c "from backend.fastapi.api.main import app; print('FastAPI loaded successfully:', app.title)"

  frontend-build-and-validate:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend-web/package.json

      - name: Install Frontend Dependencies
        run: |
          npm install

      - name: Build Next.js Web App
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: |
          npm run build

  docker-build-verification:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: [backend-test-and-build, frontend-build-and-validate]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/fastapi
          file: ./backend/fastapi/Dockerfile
          push: false
          tags: soulsense-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          push: false
          tags: soulsense-frontend:latest
